name: Deploy Documentation & AI Context to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-pages:
    name: Publish Docs Portal & llms.txt to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Pages Artifact Directory
        run: |
          mkdir -p _site/assets _site/architecture
          cp docs/index.html _site/index.html
          cp llms.txt _site/llms.txt
          cp llms-full.txt _site/llms-full.txt
          cp docs/VIBE_CODING_PROMPTS.md _site/VIBE_CODING_PROMPTS.md
          cp docs/architecture/*.md _site/architecture/ || true
          cp docs/assets/* _site/assets/ || true
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
